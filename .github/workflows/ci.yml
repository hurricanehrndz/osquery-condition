name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
permissions:
  contents: read
jobs:
  # Job names are the required status checks in the branch ruleset.
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go just
      - run: just test
      # The tool ships for macOS only; make sure it still cross-compiles.
      - run: GOOS=darwin GOARCH=arm64 go build -o /dev/null .
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go just golangci-lint
      - run: just lint
