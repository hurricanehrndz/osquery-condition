name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  meta:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Resolve and check the version
        shell: bash
        run: |
          version=$(awk -F'"' '/^const version = / { print $2 }' main.go)
          config_version=$(awk -F'"' '/^version = / { print $2; exit }' embala.toml)
          bump_version=$(awk -F'"' '/^version: / { print $2; exit }' versionbump.yaml)

          if [ -z "$version" ] || [ "$version" != "$config_version" ] || [ "$version" != "$bump_version" ]; then
            echo "::error::version mismatch: binary=$version embala=$config_version versionbump=$bump_version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  ci:
    uses: ./.github/workflows/ci.yml
  pkg:
    needs: [meta, ci]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Installs go, just, embala and rcodesign at the versions and checksums
      # in mise.lock.
      - uses: jdx/mise-action@v5
        with:
          install_args: go just github:hurricanehrndz/embala github:indygreg/apple-platform-rs
      - run: just dist
      - name: Write signing credentials
        env:
          APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_P12 }}
          APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_APPLICATION_CERTIFICATE_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_JSON: ${{ secrets.MACOS_NOTARY_API_KEY_JSON }}
        shell: bash
        run: |
          : "${APPLICATION_P12_BASE64:?MACOS_APPLICATION_CERTIFICATE_P12 is required}"
          : "${APPLICATION_P12_PASSWORD:?MACOS_APPLICATION_CERTIFICATE_PASSWORD is required}"
          : "${INSTALLER_P12_BASE64:?MACOS_INSTALLER_CERTIFICATE_P12 is required}"
          : "${INSTALLER_P12_PASSWORD:?MACOS_INSTALLER_CERTIFICATE_PASSWORD is required}"
          : "${NOTARY_API_KEY_JSON:?MACOS_NOTARY_API_KEY_JSON is required}"

          mkdir -p "$RUNNER_TEMP/signing"
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          signing = Path(os.environ["RUNNER_TEMP"]) / "signing"
          signing.joinpath("application.p12").write_bytes(
              base64.b64decode(os.environ["APPLICATION_P12_BASE64"], validate=True)
          )
          signing.joinpath("installer.p12").write_bytes(
              base64.b64decode(os.environ["INSTALLER_P12_BASE64"], validate=True)
          )
          # Output of `rcodesign encode-app-store-connect-api-key`; parse it so a
          # malformed secret fails here, not after the upload.
          key = json.loads(os.environ["NOTARY_API_KEY_JSON"])
          signing.joinpath("notary-api-key.json").write_text(json.dumps(key))
          PY
          printf '%s' "$APPLICATION_P12_PASSWORD" > "$RUNNER_TEMP/signing/application-password"
          printf '%s' "$INSTALLER_P12_PASSWORD" > "$RUNNER_TEMP/signing/installer-password"
          chmod 600 "$RUNNER_TEMP/signing/"*

          {
            echo "MACOS_APPLICATION_P12=$RUNNER_TEMP/signing/application.p12"
            echo "MACOS_APPLICATION_P12_PASSWORD_FILE=$RUNNER_TEMP/signing/application-password"
            echo "MACOS_INSTALLER_P12=$RUNNER_TEMP/signing/installer.p12"
            echo "MACOS_INSTALLER_P12_PASSWORD_FILE=$RUNNER_TEMP/signing/installer-password"
            echo "MACOS_NOTARY_API_KEY_FILE=$RUNNER_TEMP/signing/notary-api-key.json"
          } >> "$GITHUB_ENV"
      - name: Sign the binary
        run: |
          rcodesign sign \
            --p12-file "$MACOS_APPLICATION_P12" \
            --p12-password-file "$MACOS_APPLICATION_P12_PASSWORD_FILE" \
            --binary-identifier com.github.hurricanehrndz.osquery-condition \
            --code-signature-flags runtime \
            dist/osquery-condition
          codesign --verify --strict --verbose=2 dist/osquery-condition
      - name: Build the package with embala
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          embala build --config embala.toml --formats pkg --out-dir release
          pkgutil --check-signature "release/osquery-condition-$VERSION.pkg"
      - name: Notarize and staple the package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          pkg="release/osquery-condition-$VERSION.pkg"
          rcodesign notary-submit \
            --api-key-file "$MACOS_NOTARY_API_KEY_FILE" \
            --max-wait-seconds 1800 \
            --staple \
            "$pkg"
          xcrun stapler validate "$pkg"
          spctl --assess --type install -vv "$pkg"
      - name: Remove signing credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@v7
        with:
          name: pkg
          path: release/*.pkg
          if-no-files-found: error
  release:
    needs: [meta, pkg]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pkg
          path: dist
      - name: Checksums
        run: cd dist && sha256sum osquery-condition-* | tee SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "osquery-condition $VERSION" \
            --generate-notes \
            dist/*
